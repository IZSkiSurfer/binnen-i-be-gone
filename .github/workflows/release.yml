name: Browser packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check background.js
          node --check binnenibegone.js
          node --check options.js
      - name: Build packages
        run: |
          python3 scripts/package.py
          cd dist
          sha256sum *.zip *.xpi > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          name: browser-packages
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --notes "Chrome and Edge ZIPs require unpacked installation. Firefox XPI is unsigned and requires Mozilla signing for normal installation."
